[package]
name = "pg-cdc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pg-cdc-decoder = { path = "../crates/decoder" }
serde_json = "1.0.154"

[workspace]
members = ["."]

[[bin]]
name = "decode_message"
path = "fuzz_targets/decode_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map_value"
path = "fuzz_targets/map_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_json"
path = "fuzz_targets/parse_json.rs"
test = false
doc = false
bench = false
