[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]

[bans]
wildcards = "deny"
deny = [
  { crate = "openssl", reason = "rustls is the only TLS stack" },
  { crate = "openssl-sys", reason = "rustls is the only TLS stack" },
  { crate = "native-tls", reason = "rustls is the only TLS stack" },
  { crate = "aws-lc-rs", reason = "ring is the only crypto provider" },
  { crate = "aws-lc-sys", reason = "ring is the only crypto provider" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
